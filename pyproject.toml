[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youshop-finance"
version = "0.1.0"
description = "Financial Intelligence & Reconciliation Platform MVP for YouShop 2027"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "duckdb>=1.0",
  "streamlit>=1.38",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
